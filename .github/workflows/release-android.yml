name: Release Android

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build (e.g. v0.8.0). Must already exist on remote."
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as prerelease"
        required: false
        type: boolean
        default: false
      draft:
        description: "Create the GitHub Release as draft"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Upload Android Release
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android NDK & build-tools
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;34.0.0" "ndk;27.0.11902837"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.11902837" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.11902837" >> "$GITHUB_ENV"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo registry & git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/native/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: packages/native/src-tauri/target
          key: ${{ runner.os }}-rust-target-${{ hashFiles('packages/native/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-target-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('packages/native/src-tauri/gen/android/**/*.gradle*', 'packages/native/src-tauri/gen/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Configure Android signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          set -e
          APP_DIR="packages/native/src-tauri/gen/android/app"
          mkdir -p "$APP_DIR/keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$APP_DIR/keystore/release.jks"
          cat > "$APP_DIR/key.properties" <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=keystore/release.jks
          EOF
          echo "Android signing configured."

      - name: Warn missing signing secrets
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::ANDROID_KEYSTORE_BASE64 not set. The build will fall back to debug signing."

      - name: Build Android (APK + AAB)
        run: bun run build:android

      - name: List release artifacts
        run: |
          ls -lh release || true

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echo-trails-android-${{ inputs.tag }}
          path: |
            release/echo-trails-release-*.apk
            release/echo-trails-release-*.aab
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            release/echo-trails-release-*.apk
            release/echo-trails-release-*.aab
