name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build (e.g. v0.8.0). Must already exist on remote."
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as prerelease"
        required: false
        type: boolean
        default: false
      draft:
        description: "Create the GitHub Release as draft"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
            target: aarch64-apple-darwin
            artifact_glob: |
              packages/native/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              packages/native/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
          - os: macos-13
            label: macOS (Intel)
            target: x86_64-apple-darwin
            artifact_glob: |
              packages/native/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              packages/native/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
          - os: windows-latest
            label: Windows (x64)
            target: x86_64-pc-windows-msvc
            artifact_glob: |
              packages/native/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              packages/native/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry & git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('packages/native/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: packages/native/src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-rust-target-${{ hashFiles('packages/native/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-rust-target-

      - name: Install dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Build desktop bundle
        working-directory: packages/native
        run: bunx tauri build --target ${{ matrix.target }}

      - name: List release artifacts (unix)
        if: runner.os != 'Windows'
        run: |
          set -e
          echo "== bundle dir =="
          find packages/native/src-tauri/target/${{ matrix.target }}/release/bundle -maxdepth 3 -type f -print || true

      - name: List release artifacts (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundleDir = "packages/native/src-tauri/target/${{ matrix.target }}/release/bundle"
          if (Test-Path $bundleDir) {
            Get-ChildItem -Path $bundleDir -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Host "Bundle dir not found: $bundleDir"
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echo-trails-desktop-${{ matrix.target }}-${{ inputs.tag }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: warn

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: false
          files: ${{ matrix.artifact_glob }}
