name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build (e.g. v0.8.2). Must already exist on remote."
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as prerelease"
        required: false
        type: boolean
        default: false
      draft:
        description: "Create the GitHub Release as draft"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # ============================================================
  # Job 1: Android (APK + AAB)
  # ============================================================
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android NDK & build-tools
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;34.0.0" "ndk;27.0.11902837"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.11902837" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.11902837" >> "$GITHUB_ENV"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo registry & git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/native/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: packages/native/src-tauri/target
          key: ${{ runner.os }}-rust-target-${{ hashFiles('packages/native/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-target-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('packages/native/src-tauri/gen/android/**/*.gradle*', 'packages/native/src-tauri/gen/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Configure Gradle repositories (CI uses Google/MavenCentral)
        run: |
          set -e
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/ci-repos.gradle" <<'EOF'
          allprojects {
              buildscript {
                  repositories {
                      clear()
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              repositories {
                  clear()
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          settingsEvaluated { settings ->
              settings.pluginManagement {
                  repositories {
                      clear()
                      gradlePluginPortal()
                      google()
                      mavenCentral()
                  }
              }
          }
          EOF
          echo "Gradle init script written to $HOME/.gradle/init.d/ci-repos.gradle"

      - name: Configure Android signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          set -e
          APP_DIR="packages/native/src-tauri/gen/android/app"
          mkdir -p "$APP_DIR/keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$APP_DIR/keystore/release.jks"
          cat > "$APP_DIR/key.properties" <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=keystore/release.jks
          EOF
          echo "Android signing configured."

      - name: Warn missing signing secrets
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::ANDROID_KEYSTORE_BASE64 not set. The build will fall back to debug signing."

      - name: Build Android (APK + AAB)
        run: bun run build:android

      - name: List release artifacts
        run: ls -lh release || true

      - name: Read APK MD5 & version
        id: apk
        run: |
          set -e
          MD5=$(node -e "const j=require('./packages/app/public/update.json');process.stdout.write(j.android[0].md5)")
          VERSION=$(node -e "const c=require('./packages/native/src-tauri/tauri.conf.json');process.stdout.write(c.version)")
          echo "md5=$MD5" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APK MD5: $MD5" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            release/echo-trails-release-*.apk

      - name: Prepare android meta artifact
        run: |
          set -e
          mkdir -p artifact
          node -e "const fs=require('fs');const c=require('./packages/native/src-tauri/tauri.conf.json');const u=require('./packages/app/public/update.json');const a=u.android[0];const v=c.version;fs.writeFileSync('artifact/meta.json',JSON.stringify({platform:'android',version:v,md5:a.md5,apkFileName:'echo-trails-release-'+v+'.apk',description:a.description||'',forceUpdate:!!a.forceUpdate},null,2))"
          cat artifact/meta.json

      - name: Upload android meta artifact
        uses: actions/upload-artifact@v4
        with:
          name: meta-android
          path: artifact/

      - name: Upload MD5 files for PR
        uses: actions/upload-artifact@v4
        with:
          name: md5-files
          path: |
            packages/app/public/update.json
            packages/app/public/version.json

  # ============================================================
  # Job: PR MD5 / version.json onto main (separate from tag checkout)
  # ============================================================
  pr-md5:
    name: PR MD5 updates to main
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Download MD5 files
        uses: actions/download-artifact@v4
        with:
          name: md5-files

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: ci/apk-md5-${{ github.run_id }}
          commit-message: "chore(release): update APK md5 for ${{ inputs.tag }}"
          title: "chore(release): update APK md5 for ${{ inputs.tag }}"
          body: |
            Android 构建 ${{ inputs.tag }} 后自动更新 APK MD5。

            - `packages/app/public/update.json`
            - `packages/app/public/version.json`
          add-paths: |
            packages/app/public/update.json
            packages/app/public/version.json
          delete-branch: true
          labels: automated,release

  # ============================================================
  # Job 2-5: Desktop (macOS ARM / macOS Intel / Windows / Linux) — matrix
  # ============================================================
  build-desktop:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
            target: aarch64-apple-darwin
            updater_platform: darwin-aarch64
            updater_dir: macos
            updater_glob: "*.app.tar.gz"
          - os: macos-15-intel
            label: macOS (Intel)
            target: x86_64-apple-darwin
            updater_platform: darwin-x86_64
            updater_dir: macos
            updater_glob: "*.app.tar.gz"
          - os: windows-latest
            label: Windows (x64)
            target: x86_64-pc-windows-msvc
            updater_platform: windows-x86_64
            updater_dir: nsis
            updater_glob: "*-setup.exe"
          - os: ubuntu-22.04
            label: Linux (x64)
            target: x86_64-unknown-linux-gnu
            updater_platform: linux-x86_64
            updater_dir: appimage
            updater_glob: "*.AppImage"

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry & git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('packages/native/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: packages/native/src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-rust-target-${{ hashFiles('packages/native/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-rust-target-

      - name: Install dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Build desktop bundle (with updater signature)
        working-directory: packages/native
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_VERSION_URL: https://photo.sugarat.top/version.json
          VITE_BASE_ORIGIN: https://photo.sugarat.top
          TAURI: "true"
        run: bunx tauri build --target ${{ matrix.target }}

      - name: List release artifacts (unix)
        if: runner.os != 'Windows'
        run: |
          set -e
          echo "== bundle dir =="
          find packages/native/src-tauri/target/${{ matrix.target }}/release/bundle -maxdepth 3 -type f -print || true

      - name: List release artifacts (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundleDir = "packages/native/src-tauri/target/${{ matrix.target }}/release/bundle"
          if (Test-Path $bundleDir) {
            Get-ChildItem -Path $bundleDir -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Host "Bundle dir not found: $bundleDir"
          }

      - name: Rename updater artifacts to ASCII names
        # GitHub Release 会剔除 asset 文件名中的非 ASCII 字符（如中文 productName 生成的
        # 记忆的回响.app.tar.gz → app.tar.gz），导致 latest.json 中的原始中文 URL 404；
        # 同时 darwin 两平台产物同名会互相覆盖。这里统一重命名为带平台后缀的 ASCII 名。
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="packages/native/src-tauri/target/${{ matrix.target }}/release/bundle"
          case "${{ matrix.updater_platform }}" in
            darwin-aarch64) DST_NAME="EchoTrails_aarch64.app.tar.gz" ;;
            darwin-x86_64)  DST_NAME="EchoTrails_x64.app.tar.gz" ;;
            windows-x86_64) DST_NAME="EchoTrails_x64-setup.exe" ;;
            linux-x86_64)   DST_NAME="EchoTrails_amd64.AppImage" ;;
          esac
          SRC=$(find "$BUNDLE_DIR/${{ matrix.updater_dir }}" -name "${{ matrix.updater_glob }}" -not -name "*.sig" | head -1)
          if [ -z "$SRC" ]; then
            echo "ERROR: updater artifact not found in $BUNDLE_DIR/${{ matrix.updater_dir }}"
            exit 1
          fi
          DST="$BUNDLE_DIR/${{ matrix.updater_dir }}/$DST_NAME"
          mv "$SRC" "$DST"
          mv "$SRC.sig" "$DST.sig"
          echo "Renamed updater artifact:"
          echo "  $SRC -> $DST"

      - name: Publish desktop artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: false
          files: |
            packages/native/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            packages/native/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            packages/native/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            packages/native/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            packages/native/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            packages/native/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe.sig
            packages/native/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            packages/native/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.sig
            packages/native/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.tar.gz
            packages/native/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.tar.gz.sig
            packages/native/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            packages/native/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm

      - name: Prepare desktop meta + signature artifact
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="packages/native/src-tauri/target/${{ matrix.target }}/release/bundle"
          echo "== ${{ matrix.updater_dir }} dir =="
          ls -la "$BUNDLE_DIR/${{ matrix.updater_dir }}" || true
          ARTIFACT=$(find "$BUNDLE_DIR/${{ matrix.updater_dir }}" -name "${{ matrix.updater_glob }}" -not -name "*.sig" | head -1)
          if [ -z "$ARTIFACT" ]; then
            echo "ERROR: updater artifact not found in $BUNDLE_DIR/${{ matrix.updater_dir }}"
            echo "== bundle tree =="
            find "$BUNDLE_DIR" -maxdepth 3 -type f -print || true
            exit 1
          fi
          SIG="${ARTIFACT}.sig"
          if [ ! -f "$SIG" ]; then
            echo "ERROR: signature file not found: $SIG"
            echo "Hint: ensure TAURI_SIGNING_PRIVATE_KEY secret is configured."
            exit 1
          fi
          FILENAME=$(basename "$ARTIFACT")
          URL="https://github.com/ATQQ/echo-trails/releases/download/${{ inputs.tag }}/${FILENAME}"
          mkdir -p artifact
          cp "$SIG" artifact/signature.sig
          node -e "const fs=require('fs');fs.writeFileSync('artifact/meta.json',JSON.stringify({platform:process.argv[1],url:process.argv[2],version:''},null,2))" "${{ matrix.updater_platform }}" "$URL"
          echo "=== meta.json ==="
          cat artifact/meta.json

      - name: Upload desktop meta artifact
        uses: actions/upload-artifact@v4
        with:
          name: meta-${{ matrix.updater_platform }}
          path: artifact/

  # ============================================================
  # Job 6: Generate & publish latest.json (needs all builds)
  # ============================================================
  publish-latest-json:
    name: Publish latest.json
    needs: [build-android, build-desktop]
    if: ${{ always() && !cancelled() && needs.build-android.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download all meta artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-meta

      - name: List downloaded meta
        run: |
          echo "=== release-meta tree ==="
          find release-meta -type f -print

      - name: Generate latest.json
        run: bun run scripts/generate-latest-json.ts --input ./release-meta --output ./latest.json

      - name: Sync latest.json to packages/app/public
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin main
          git checkout -f main
          mkdir -p packages/app/public
          cp latest.json packages/app/public/latest.json
          git add packages/app/public/latest.json
          git diff --cached --quiet || git commit -m "chore(release): sync latest.json@${{ inputs.tag }}"
          git push origin main

      - name: Publish latest.json to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          # 仅非 prerelease 时标记为 latest，保证 releases/latest/download/latest.json 重定向可达
          make_latest: ${{ inputs.prerelease && 'false' || 'true' }}
          files: latest.json
