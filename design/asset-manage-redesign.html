      '<li><b>概览</b>：总资产估值、日均成本、状态数量与进度条。</li>' +
      '<li><b>条目</b>：图片预览、成本/持有天数/使用次数、卖出价与盈亏、快捷记录一次、编辑、删除；实际实现保留左滑操作。</li>' +
      '<li><b>详情</b>：完整字段、按次资产历史记录；按次且未卖出才可记录一次，已卖出只读。</li>' +
      '<li><b>表单</b>：图片、名称、分类、子分类、状态、金额、购入日期、卖出价格/日期、计费方式、描述与校验全部保留。</li>' +
      '<li><b>统计 / 时间线 / 分类管理</b>：现有口径与操作保留，卖出资产继续显示标签与盈亏。</li></ul>' +

      '<h3>设计令牌</h3>' +
      '<div class="swatches">' + swatches.map(function (s) {
        return '<div class="swatch"><i style="background:' + s[0] + '"></i>' + s[0] + ' ' + s[1] + '</div>';
      }).join('') + '</div>' +
      '<p>卡片圆角 12px、按钮 8px、弹层 16px，间距 8px 体系，动效统一 <code>cubic-bezier(.16,1,.3,1)</code>。' +
      '品牌蓝只出现在「主按钮 / 选中态 / 链接」，状态与盈亏用语义色承载，页面不再整屏蓝。</p>' +

      '<h3>现状问题（含根因）</h3>' +
      '<div class="issue"><b>1. 图片预览不进返回栈，返回直接退页</b>' +
      '<code>AssetItem.vue</code> 与 <code>AssetForm.vue</code> 用的是 Vant 命令式 <code>showImagePreview()</code>，不经过 <code>preventBack</code>，' +
      '安卓返回键会穿透到路由 <code>back()</code>。项目里 <code>PreviewImage.vue</code> 走的是 <code>preventBack(show)</code>，资产模块没有复用它。</div>' +
      '<div class="issue"><b>2. 表单里的选择器 / 日历没进返回栈</b>' +
      '分类、子分类、状态选择器与购入日历只有 <code>v-model:show</code>，没有 <code>preventBack</code>，按返回会直接关掉整个表单并丢掉已填内容。</div>' +
      '<div class="issue"><b>3. 还有一批裸浮层</b>' +
      '<code>AssetList</code> 的「增加使用次数」对话框、<code>AssetManage</code> 的两个新增分类对话框、<code>handleDelete</code> 的确认框都没有进返回栈。</div>' +
      '<div class="issue"><b>4. 时间线看不到日期</b>' +
      '<code>AssetTimeline.vue</code> 里 <code>.time-column</code> 被 <code>display:none</code> 掉，日期节点实际不可见，只剩年份分组。</div>' +
      '<div class="issue"><b>5. 左侧返回语义不统一</b>' +
      '列表页是 <code>router.back()</code>，统计 / 时间线 / 管理页是 <code>router.push(\'/discovery\')</code>，同一个模块里返回手势不一致。</div>' +
      '<div class="issue"><b>6. keep-alive 导致统计页数据不刷新</b>' +
      '<code>AssetLayout</code> 用了 <code>keep-alive</code>，统计页只在 <code>onMounted</code> 拉一次；新增资产后切回统计，数字可能是旧的。</div>' +
      '<div class="issue"><b>7. 时间线 / 统计依赖别的页先把 store 装满</b>' +
      '<code>AssetTimeline</code> 没有 <code>loadData()</code>，直接进入会出现「暂无资产记录」。</div>' +
      '<div class="issue"><b>8. 缺少详情页，使用记录口径不清晰</b>' +
      '列表只能左滑编辑 / 删除，没有地方看一件资产的完整信息；设计稿还错误地给按天 / 消耗品展示了使用记录。</div>' +

      '<h3>信息架构调整</h3>' +
      '<ul><li>底部四个页签保留：<b>全部 / 时间线 / 统计 / 管理</b>，但把「分类管理」从独立页降级为管理页内的一块 + 右上角入口。</li>' +
      '<li>新增<b>资产详情页</b>：大图 + 关键指标 + 全量字段 + 按次资产的编辑 / 记录一次 / 只读历史。</li>' +
      '<li>列表保留现有<b>状态筛选</b>与<b>分类 / 子分类筛选</b>，默认仍按现有实现展示「服役中」。</li>' +
      '<li>使用记录只属于<b>服役中的按次资产</b>；按天、消耗品、已退役、已卖出都不提供记录入口。</li>' +
      '<li>已退役资产补充<b>退役时间</b>，用于表示不再使用，并冻结持有天数与日均成本。</li>' +
      '<li>删除分类仍按现有实现：同时删除其下子分类，不新增资产迁移逻辑。</li></ul>' +

      '<h3>页面结构</h3>' +
      '<ul><li><b>手机</b>：AppBar（返回 / 标题 / 分类入口 / 添加）→ 摘要卡（总资产估值 / 日均成本）→ 状态 chips → 实时搜索 → 分类 Tab / 子分类 chips → 资产卡列表 → 底部页签。</li>' +
      '<li><b>桌面（≥480）</b>：左侧 196px 常驻导航（四个页签纵向），右侧内容区最大 860px 居中，抽屉改为居中面板。</li>' +
      '<li><b>资产卡</b>：缩略图 + 名称 + 状态标签 + 分类与购入日期 + 右侧关键数字（按次显示单次成本、按天显示日均成本、已卖出显示盈亏）。</li>' +
      '<li><b>表单</b>：主图置顶，后接「基本信息 / 价格与时间 / 计费与备注」；选到「已退役」就展开「退役信息（必填）」，选到「已卖出」就展开橙色「卖出信息（必填）」并实时显示预计盈亏。</li>' +
      '<li><b>时间线</b>：年份分组 + 时间轴节点，节点颜色跟随状态，卡片内直接显示购入 / 卖出日期与持有天数，已卖出带橙色标签和盈亏。</li></ul>' +

      '<h3>返回栈规范（本次重点）</h3>' +
      '<p>所有浮层都注册到 <code>@/lib/router</code> 的 <code>preventBack</code>，返回键<b>从最上层开始关</b>，顺序固定：</p>' +
      '<ul><li>Toast（不拦截）→ <b>图片预览</b> → <b>选择器 / 日历 / 日期</b> → <b>底部抽屉 / 对话框</b> → <b>表单</b> → <b>详情</b> → <b>列表</b> → 离开模块。</li>' +
      '<li>图片预览优先复用项目已有的 <code>PreviewImage</code> 组件（自带 <code>preventBack</code> 与滑动切换）；资产这种轻量单图场景若继续用 Vant 预览，需用受控 <code>show</code> 包一层 <code>preventBack</code>。</li>' +
      '<li>当表单内浮层打开时，返回键只关浮层，绝不能丢弃未保存的表单内容；若表单已有改动再退一层，先弹「放弃编辑？」确认。</li>' +
      '<li>原型右下角「模拟 Android 返回键」可直接验证优先级与栈内容。</li></ul>' +

      '<h3>状态覆盖</h3>' +
      '<ul><li>加载：卡片骨架屏（不用 spinner）。空态：无资产 → 引导添加；筛选无结果 → 引导切换筛选。</li>' +
      '<li>失败：列表失败给整块重试；保存失败保留表单并提示具体字段，不整页弹 toast 兜底。</li>' +
      '<li>历史退役数据缺退役时间：显示「未记录」，不冻结持有天数，编辑时才要求补齐。</li>' +
      '<li>历史卖出数据缺卖出价：显示「未记录卖出价」，卖出状态卡显示「未记录」，编辑时才要求补齐。</li>' +
      '<li>动效统一 <code>cubic-bezier(.16,1,.3,1)</code>，<code>prefers-reduced-motion</code> 下降级为淡入。</li></ul>' +

      '<h3>其它页面（本轮只收集问题）</h3>' +
      '<ul><li><b>相册列表</b>：图片预览必须和资产图片一样进入返回栈；本轮不重做网格和筛选。</li>' +
      '<li><b>设置</b>：只记录二级页与弹窗的返回语义问题；分组卡片、图标和文案建议留到下一轮。</li>' +
      '<li><b>首页 / 发现 / 体重 / 事件 / 收藏 / 云盘</b>：先按同一返回栈与反馈规范做问题清单，不产出完整设计稿。</li></ul>' +

      '<h3>Vue 落地映射（评审通过后）</h3>' +
      '<ul><li>拆出 <code>AssetCard.vue</code>、<code>AssetSummary.vue</code>、<code>AssetDetailView.vue</code>、<code>AssetActionSheet.vue</code>、<code>useAssetBackStack.ts</code>。</li>' +
      '<li><code>AssetForm</code> 的四个选择器 + 日历 + 图片预览全部补 <code>preventBack</code>；表单状态改 <code>seg</code> 控件；校验改为字段级 <code>formErrors</code>。</li>' +
      '<li><code>AssetList</code> 的 <code>showIncrementDialog</code>、<code>handleDelete</code> 确认框补 <code>preventBack</code>；记录入口限定为服役中的按次资产。</li>' +
      '<li><code>AssetTimeline</code> 恢复日期显示；<code>AssetStats</code>/<code>AssetTimeline</code> 改为 <code>onActivated</code> 时按需 <code>loadData()</code>，解决 keep-alive 陈旧问题。</li>' +
      '<li>返回语义统一：模块内子页统一 <code>router.back()</code>，仅在栈空时兜底回 <code>/discovery</code>。</li>' +
      '<li>双模式：远程 API 与本地 Tauri 两条路径同时实现，卖出字段沿用 <code>soldPrice</code>/<code>soldDate</code>；退役时间若进入实现，需要同步补 <code>retiredDate</code>。</li></ul>' +

      '<h3>验收清单</h3>' +
      '<ul><li>图片预览打开时按返回，只关预览、页面保留。</li><li>列表输入关键词立即过滤；有内容时显示清空图标，点击清空后恢复完整列表。</li>' +
      '<li>表单里逐层打开选择器 / 日历，返回逐层关闭且表单内容不丢。</li>' +
      '<li>只有服役中的按次资产显示记录一次与使用记录；按天、消耗品、已退役、已卖出不显示或只读。</li>' +
      '<li>360–1440 宽不破版；手机 / 桌面两套布局可切换。</li><li>已卖出资产在列表、详情、时间线三处都能看到状态标签与盈亏，颜色一致。</li>' +
      '<li>空 / 加载 / 失败 / 筛选无结果四种状态可达。</li><li>reduced-motion 下无位移动画；键盘 Tab 焦点可见。</li></ul>';
  }

  /* ---------------- 启动 ---------------- */
  baseEl = document.getElementById('base');
  overlayEl = document.getElementById('overlay');
  toastEl = document.getElementById('toastLayer');
  hintEl = document.getElementById('stackHint');

  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.getElementById('backKey').addEventListener('click', goBack);
  document.getElementById('toastKey').addEventListener('click', function () { toast('保存成功', 'ok'); });

  document.getElementById('viewportSeg').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-view]');
    if (!btn) return;
    store.view = btn.getAttribute('data-view');
    Array.prototype.forEach.call(this.querySelectorAll('button'), function (b) {
      b.classList.toggle('is-active', b === btn);
    });
    render();
  });

  document.getElementById('screenSelect').addEventListener('change', function () {
    var v = this.value;
    store.sheet = null;
    store.previewOpen = false;
    store.formErrors = {};
    store.formDirty = false;
    store.expandedCat = null;
    if (v === 'list-sold') { store.screen = 'list'; store.filter = 'sold'; }
    else if (v === 'detail') { store.detailId = 'a3'; store.screen = 'detail'; }
    else if (v === 'form') { store.form = emptyForm(findAsset('a3')); store.formReturn = 'list'; store.screen = 'form'; }
    else if (v === 'preview') { store.screen = 'detail'; store.detailId = 'a1'; store.previewOpen = true; }
    else if (v === 'other') { store.screen = 'other'; }
    else { store.screen = v; store.filter = 'active'; store.cat = 'all'; store.sub = 'all'; }
    render();
  });

  var spec = document.getElementById('spec');
  spec.innerHTML = buildSpec();
  document.getElementById('specToggle').addEventListener('click', function () {
    var open = spec.classList.toggle('is-open');
    spec.setAttribute('aria-hidden', open ? 'false' : 'true');
    this.textContent = open ? '收起说明' : '交互说明';
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { goBack(); }
  });

  render();
  window.__proto = store;
})();
</script>
</body>
</html>
