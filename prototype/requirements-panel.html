<body>
  <div class="native-drag-region" data-tauri-drag-region aria-hidden="true"></div>
  <div class="app-shell" id="app"></div>
  <div id="modal-root"></div>
  <script>
  (() => {
    const KEY = 'shixu-workbench-v1';
    const icons = {
      home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
      spark:'<path d="m12 3 1.9 5.8L20 11l-6.1 2.2L12 19l-2-5.8L4 11l6-2.2z"/><path d="m19 14 1 2.5 2.5 1-2.5 1L19 21l-1-2.5-2.5-1 2.5-1z"/>',
      grid:'<rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="5" rx="1"/><rect x="13" y="10" width="8" height="11" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/>',
      task:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 .8.8L6 5M3.5 12l.8.8L6 11M3.5 18l.8.8L6 17"/>',
      plus:'<path d="M12 5v14M5 12h14"/>', search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
      more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
      arrow:'<path d="M7 17 17 7M7 7h10v10"/>', check:'<path d="m5 12 4 4L19 6"/>',
      close:'<path d="m18 6-12 12M6 6l12 12"/>', box:'<path d="M4 7h16M4 12h16M4 17h16"/>',
      folder:'<path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
      clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      light:'<path d="M9 18h6M10 22h4M8 14a7 7 0 1 1 8 0c-1 .7-1 1.5-1 2H9c0-.5 0-1.3-1-2z"/>',
      archive:'<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v12h14V8M10 12h4"/>',
      edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/>',
      trash:'<path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/>'
    };
    const icon = (name, cls='') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${icons[name] || icons.box}</svg>`;
    // Preview-only platform detection. The Vue implementation uses the existing app shell.
    const native = !!(window.__TAURI__ || window.__TAURI_INTERNALS__);
    const mobilePlatform = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    document.body.classList.toggle('native-desktop', native && !mobilePlatform);
    const uid = () => Math.random().toString(36).slice(2, 9);
    const today = new Date();
    const dateAfter = n => { const d=new Date(today); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
    const seed = () => ({
      projects:[
        {id:'p1',name:'Echo Trails',description:'个人生活记录与相册体验',color:'#388b7e',archived:false},
        {id:'p2',name:'轻记 · 灵感捕手',description:'把碎片想法变成可执行的小事',color:'#c48a4b',archived:false},
        {id:'p3',name:'工作台重构',description:'整理日常项目与研发流程',color:'#6782b1',archived:false}
      ],
      tasks:[
        {id:'t1',title:'整理首页的信息层级',projectId:'p1',status:'active',progress:65,priority:'high',due:dateAfter(1),note:'优先把常用入口和最近内容放到首屏。'},
        {id:'t2',title:'补齐相册空状态和加载反馈',projectId:'p1',status:'todo',progress:0,priority:'medium',due:dateAfter(3),note:'覆盖首次使用和网络慢的场景。'},
        {id:'t3',title:'验证快速记录的交互路径',projectId:'p2',status:'active',progress:40,priority:'high',due:dateAfter(0),note:'从捕捉想法到转成任务尽量不打断。'},
        {id:'t4',title:'收集常见的项目切换场景',projectId:'p3',status:'todo',progress:0,priority:'low',due:'',note:'记录在手机和桌面上切换项目的使用时机。'},
        {id:'t5',title:'统一任务状态的命名和颜色',projectId:'p3',status:'done',progress:100,priority:'medium',due:dateAfter(-1),note:'已完成状态颜色检查。'},
        {id:'t6',title:'画出灵感收件箱的第一版结构',projectId:'p2',status:'done',progress:100,priority:'medium',due:dateAfter(-2),note:'保留轻量标签与转任务入口。'}
      ],
      ideas:[
        {id:'i1',title:'灵感先收下，之后再决定',body:'记录时不要求选项目或写完整需求。先把一句话放进收件箱，整理时再补充背景和下一步。',tag:'交互体验',created:dateAfter(0)},
        {id:'i2',title:'每个项目一个轻量周记',body:'自动汇总本周完成项与卡住的事情，周五花两分钟回顾，不增加日报负担。',tag:'产品想法',created:dateAfter(-1)},
        {id:'i3',title:'手机上单手就能推进任务',body:'常用的状态和进度更新应在任务卡片附近完成，不需要打开一层层的详情页。',tag:'体验优化',created:dateAfter(-2)}
      ]
    });
    let data;
    try { data=JSON.parse(localStorage.getItem(KEY)) || seed(); } catch { data=seed(); }
    let view='home', activeProject='', searchTerm='', statusFilter='all', ideaFilter='all', toastTimer, modalTrigger;
    const app=document.getElementById('app'), modalRoot=document.getElementById('modal-root');
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const persist=()=>localStorage.setItem(KEY,JSON.stringify(data));
    const activeProjects=()=>data.projects.filter(p=>!p.archived);
    const projectBy=id=>data.projects.find(p=>p.id===id);
    const projectName=id=>projectBy(id)?.name || '灵感收件箱';
    const projectColor=id=>projectBy(id)?.color || '#9ba3aa';
    const tasksFor=id=>data.tasks.filter(t=>!id||t.projectId===id);
    const activeTasks=()=>data.tasks.filter(t=>t.status!=='done');
    const statusName={todo:'待开始',active:'进行中',done:'已完成'};
    const priorityName={high:'高优先级',medium:'普通',low:'低优先级'};
    const fmtDate=s=>{if(!s)return '';const d=new Date(s+'T00:00:00');return `${d.getMonth()+1}月${d.getDate()}日`;};
    const relative=s=>{if(!s)return '刚刚';const days=Math.floor((new Date(today.toDateString())-new Date(s+'T00:00:00'))/86400000);return days<=0?'今天':days===1?'昨天':`${days} 天前`;};
    function notify(text){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=text;document.body.append(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),2200);}
    function go(v,id=''){view=v;activeProject=id;render();document.querySelector('main').scrollTo({top:0,behavior:'smooth'});}
    function navButton(v,label,ico,count=''){return `<button class="nav-item ${view===v?'active':''}" data-view="${v}">${icon(ico)}<span>${label}</span>${count!==''?`<span class="count">${count}</span>`:''}</button>`;}
    function projectNav(){return activeProjects().map(p=>`<button class="project-link" data-project="${p.id}"><i class="project-dot" style="background:${esc(p.color)}"></i><span>${esc(p.name)}</span><small>${tasksFor(p.id).filter(t=>t.status!=='done').length}</small></button>`).join('');}
    function layout(content,title){
      app.innerHTML=`<aside class="sidebar"><div class="brand"><span class="brand-mark">${icon('spark')}</span><span>需求面板</span></div><div class="nav-label">工作区</div><nav class="nav-list">${navButton('home','总览','home')}${navButton('ideas','灵感收件箱','spark',data.ideas.length)}${navButton('projects','项目','grid',activeProjects().length)}${navButton('tasks','所有任务','task',activeTasks().length)}</nav><div class="nav-label" style="margin-top:17px">我的项目 <button class="text-action" style="float:right;padding:0" data-action="new-project">＋</button></div><div class="project-nav">${projectNav() || '<div class="empty">还没有项目</div>'}</div><div class="sidebar-bottom">${icon('archive')} 演示数据 · 仅保存在当前浏览器</div></aside>
      <main><header class="topbar"><div class="crumb">Echo Trails / 需求面板 <span style="padding:0 7px;color:#c0c5ca">/</span><b>${esc(title)}</b></div><div class="top-actions"><button class="icon-btn" title="搜索任务" aria-label="搜索任务" data-view="tasks">${icon('search')}</button><button class="icon-btn" title="快速记录灵感" aria-label="快速记录灵感" data-action="new-idea">${icon('spark')}</button><span class="avatar" title="个人工作区">我</span></div></header><div class="content">${content}</div></main>
      <nav class="mobile-nav"><button data-view="home" class="${view==='home'?'active':''}">${icon('home')}<span>首页</span></button><button data-view="ideas" class="${view==='ideas'?'active':''}">${icon('spark')}<span>灵感</span></button><button data-view="projects" class="${view==='projects'?'active':''}">${icon('grid')}<span>项目</span></button><button data-view="tasks" class="${view==='tasks'?'active':''}">${icon('task')}<span>任务</span></button></nav>`;
      bindAppEvents();
    }
    const heading=(eyebrow,title,desc,actions='')=>`<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div><div class="heading-actions">${actions}</div></div>`;
    const primary=(action,text,ico='plus')=>`<button class="btn btn-primary" data-action="${action}">${icon(ico)}${text}</button>`;
    function taskRow(t){const overdue=t.due&&t.status!=='done'&&t.due<dateAfter(0);return `<div class="task-row"><button class="check ${t.status==='done'?'done':''}" aria-label="${t.status==='done'?'标记未完成':'标记完成'}" data-toggle="${t.id}">${t.status==='done'?icon('check'):''}</button><div class="task-main" data-edit-task="${t.id}"><div class="task-title ${t.status==='done'?'completed':''}">${esc(t.title)}</div><div class="task-meta"><span class="project-pill"><i style="background:${projectColor(t.projectId)}"></i>${esc(projectName(t.projectId))}</span><span class="priority ${t.priority==='high'?'high':t.priority==='low'?'low':''}">${t.priority==='high'?'↑ ':t.priority==='low'?'↓ ':''}${priorityName[t.priority]}</span><span class="due ${overdue?'late':''}">${t.due?fmtDate(t.due):''}</span></div></div><div class="progress-wrap"><span>${t.progress}%</span><div class="progress"><i style="width:${t.progress}%"></i></div></div></div>`;}
    function projectCard(p){const ts=tasksFor(p.id),done=ts.filter(t=>t.status==='done').length,pct=ts.length?Math.round(done/ts.length*100):0;return `<div class="project-card" data-project="${p.id}"><div class="project-symbol" style="background:${esc(p.color)}18;color:${esc(p.color)}">${esc(p.name.slice(0,1))}</div><div><div class="project-name">${esc(p.name)}</div><div class="project-desc">${ts.filter(t=>t.status!=='done').length} 项进行中 · ${done} 项已完成</div><div class="project-progress"><i style="width:${pct}%"></i></div></div><span class="project-rate">${pct}%</span></div>`;}
    function ideaMini(i){return `<div class="idea-mini" data-edit-idea="${i.id}"><span class="idea-mark">✳</span><span><strong>${esc(i.title)}</strong><small>${esc(i.tag||'未分类')} · ${relative(i.created)}</small></span></div>`;}
    function renderHome(){const active=activeTasks().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,5);const dueToday=activeTasks().filter(t=>t.due===dateAfter(0)).length;const pct=data.tasks.length?Math.round(data.tasks.filter(t=>t.status==='done').length/data.tasks.length*100):0;
      const stats=`<div class="stats"><div class="stat"><div class="stat-top"><span>进行中的任务</span><span class="stat-icon">${icon('task')}</span></div><strong>${activeTasks().length}<small>项</small></strong></div><div class="stat"><div class="stat-top"><span>正在推进的项目</span><span class="stat-icon">${icon('grid')}</span></div><strong>${activeProjects().length}<small>个</small></strong></div><div class="stat"><div class="stat-top"><span>今天到期</span><span class="stat-icon">${icon('clock')}</span></div><strong>${dueToday}<small>项任务</small></strong></div><div class="stat"><div class="stat-top"><span>整体完成率</span><span class="stat-icon">${icon('check')}</span></div><strong>${pct}<small>%</small></strong></div></div>`;
      const actions=`<button class="btn" data-action="new-idea">${icon('spark')}记下灵感</button>${primary('new-task','新建任务')}`;
      const tasksPanel=`<section class="panel"><div class="panel-head"><h2>接下来要做 <span class="sub-count">${active.length} 项</span></h2><button class="text-action" data-view="tasks">查看全部 ${icon('arrow')}</button></div><div class="task-list">${active.map(taskRow).join('')||'<div class="empty">没有待处理任务，给自己一点喘息时间。</div>'}</div></section>`;
      const projectsPanel=`<section class="panel"><div class="panel-head"><h2>项目进展</h2><button class="text-action" data-view="projects">全部项目</button></div><div class="project-list">${activeProjects().slice(0,4).map(projectCard).join('')||'<div class="empty">创建项目，开始整理工作</div>'}</div></section>`;
      const ideasPanel=`<section class="panel"><div class="panel-head"><h2>最近的灵感 <span class="sub-count">${data.ideas.length}</span></h2><button class="text-action" data-view="ideas">收件箱</button></div><div class="idea-list">${data.ideas.slice().sort((a,b)=>b.created.localeCompare(a.created)).slice(0,3).map(ideaMini).join('')||'<div class="empty">灵感会在这里等你</div>'}</div></section>`;
      layout(heading(today.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'}),'今天，也有几件重要的事','把脑海里的想法放下来，再一步步变成进展。',actions)+stats+`<div class="dashboard-grid">${tasksPanel}<div class="side-stack">${projectsPanel}${ideasPanel}</div></div>`,'总览');}
    function renderTasks(){let list=tasksFor(activeProject).filter(t=>(statusFilter==='all'||t.status===statusFilter)&&(!searchTerm||`${t.title} ${t.note} ${projectName(t.projectId)}`.toLowerCase().includes(searchTerm.toLowerCase())));const project=projectBy(activeProject);const actions=primary('new-task','新建任务');const tools=`<div class="view-toolbar"><label class="searchbox">${icon('search')}<input id="task-search" placeholder="搜索任务或项目" value="${esc(searchTerm)}"></label><select class="select" id="task-filter"><option value="all">所有状态</option>${Object.entries(statusName).map(([k,v])=>`<option value="${k}" ${statusFilter===k?'selected':''}>${v}</option>`).join('')}</select><span class="spacer"></span>${project?`<button class="btn" data-action="edit-project" data-id="${project.id}">${icon('edit')}项目设置</button>`:''}${actions}</div>`;
      const cols=['todo','active','done'].map(s=>{const ts=list.filter(t=>t.status===s);return `<section class="board-column " data-column="${s}"><div class="column-head"><i class="column-dot ${s}"></i><strong>${statusName[s]}</strong><small>${ts.length}</small>${s==='todo'?`<button class="icon-btn" aria-label="新增任务" data-action="new-task">${icon('plus')}</button>`:''}</div><div class="board-cards">${ts.map(t=>`<article class="task-card" data-edit-task="${t.id}"><div class="task-card-title">${esc(t.title)}</div>${t.note?`<div class="task-card-note">${esc(t.note)}</div>`:''}<div class="task-card-bottom"><span class="task-card-project"><i class="project-dot" style="width:6px;height:6px;background:${projectColor(t.projectId)}"></i>${esc(projectName(t.projectId))}</span><span class="card-progress"><span>${t.progress}%</span><span class="progress"><i style="width:${t.progress}%"></i></span></span></div></article>`).join('')||'<div class="empty">暂无任务</div>'}</div></section>`;}).join('');
      layout(heading(project?'项目任务': '所有任务',project?esc(project.name):'任务看板',project?esc(project.description||'按状态查看与推进任务'):'所有项目的任务都在这里，随时调整状态和进度。',actions)+tools+`<div class="board">${cols}</div>`,'任务');const input=document.getElementById('task-search');input?.addEventListener('input',e=>{searchTerm=e.target.value;const pos=e.target.selectionStart;renderTasks();const next=document.getElementById('task-search');next.focus();next.setSelectionRange(pos,pos);});document.getElementById('task-filter')?.addEventListener('change',e=>{statusFilter=e.target.value;renderTasks();});}
    function renderIdeas(){const items=data.ideas.filter(i=>ideaFilter==='all'||i.tag===ideaFilter).sort((a,b)=>b.created.localeCompare(a.created));const tags=[...new Set(data.ideas.map(i=>i.tag).filter(Boolean))];const tools=`<div class="view-toolbar"><select class="select" id="idea-filter"><option value="all">所有灵感</option>${tags.map(t=>`<option ${ideaFilter===t?'selected':''}>${esc(t)}</option>`).join('')}</select><span class="spacer"></span><span style="color:#929aa3;font-size:11px">${data.ideas.length} 条记录</span>${primary('new-idea','记下灵感','spark')}</div>`;const cards=items.map(i=>`<article class="idea-card" data-edit-idea="${i.id}"><div class="idea-top"><span class="idea-type">${esc(i.tag||'未分类')}</span><button class="icon-btn" aria-label="编辑灵感">${icon('more')}</button></div><div class="idea-title">${esc(i.title)}</div><div class="idea-body">${esc(i.body)}</div><div class="idea-foot"><span>${relative(i.created)}</span><span>点击查看详情 ↗</span></div></article>`).join('')||'<div class="panel empty">还没有灵感，先记录下来再说。</div>';layout(heading('先捕捉，再整理','灵感收件箱','不必立刻想清楚，把值得保留的念头记下来。',primary('new-idea','记下灵感','spark'))+tools+`<div class="idea-grid">${cards}</div>`,'灵感收件箱');document.getElementById('idea-filter')?.addEventListener('change',e=>{ideaFilter=e.target.value;renderIdeas();});}
    function renderProjects(){const projects=activeProjects();const archived=data.projects.filter(p=>p.archived);const cards=projects.map(p=>{const ts=tasksFor(p.id),done=ts.filter(t=>t.status==='done').length,pct=ts.length?Math.round(done/ts.length*100):0;return `<article class="project-tile" data-project="${p.id}"><div class="tile-head"><span class="project-symbol" style="background:${esc(p.color)}18;color:${esc(p.color)}">${esc(p.name.slice(0,1))}</span><span><strong>${esc(p.name)}</strong><small>${ts.length} 项任务</small></span><button class="icon-btn tile-menu" aria-label="项目设置" data-action="edit-project" data-id="${p.id}">${icon('more')}</button></div><div class="tile-desc">${esc(p.description||'暂无项目描述')}</div><div class="tile-bottom"><span>${ts.filter(t=>t.status!=='done').length} 项进行中</span><span>${pct}% 完成</span></div><div class="tile-progress"><i style="width:${pct}%"></i></div></article>`;}).join('');const archivedBlock=archived.length?`<section style="grid-column:1/-1;margin-top:15px"><div class="panel-head" style="padding:0;margin-bottom:8px"><h2>已归档 <span class="sub-count">${archived.length}</span></h2></div><div class="project-grid">${archived.map(p=>`<article class="project-tile"><div class="tile-head"><span class="project-symbol" style="background:${esc(p.color)}18;color:${esc(p.color)}">${esc(p.name.slice(0,1))}</span><span><strong>${esc(p.name)}</strong><small>已归档</small></span><button class="icon-btn tile-menu" aria-label="恢复项目" data-action="edit-project" data-id="${p.id}">${icon('archive')}</button></div><div class="tile-desc">${esc(p.description||'暂无项目描述')}</div></article>`).join('')}</div></section>`:'';layout(heading('把注意力放在重要的事','我的项目','项目保持轻量，让每一步进展都看得见。',primary('new-project','新建项目'))+`<div class="project-grid">${cards}<button class="project-tile" style="border-style:dashed;min-height:165px;display:grid;place-content:center;justify-items:center;color:#818b94;gap:8px" data-action="new-project">${icon('plus')}<span style="font-size:11px">添加一个项目</span></button>${archivedBlock}</div>`,'项目');}
    function render(){if(view==='home')return renderHome();if(view==='ideas')return renderIdeas();if(view==='projects')return renderProjects();return renderTasks();}
    function bindAppEvents(){app.onclick=e=>{const target=e.target.closest('[data-view],[data-project],[data-action],[data-edit-task],[data-edit-idea],[data-toggle]');if(!target)return;if(target.dataset.view){go(target.dataset.view);return;}if(target.dataset.project){go('tasks',target.dataset.project);return;}if(target.dataset.editTask){openTask(target.dataset.editTask);return;}if(target.dataset.editIdea){openIdea(target.dataset.editIdea);return;}if(target.dataset.toggle){toggleTask(target.dataset.toggle);return;}const action=target.dataset.action;if(action==='new-task')openTask();if(action==='new-idea')openIdea();if(action==='new-project')openProject();if(action==='edit-project')openProject(target.dataset.id);};}
    function openModal(html){modalTrigger=document.activeElement;document.body.classList.add('modal-open');modalRoot.innerHTML=`<div class="overlay" data-dismiss="true"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${html}</section></div>`;modalRoot.querySelector('.overlay').addEventListener('click',e=>{if(e.target.dataset.dismiss)closeModal();});modalRoot.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',closeModal));modalRoot.querySelector('h2').id='dialog-title';modalRoot.querySelector('[data-close]').focus();}
    function closeModal(){modalRoot.innerHTML='';document.body.classList.remove('modal-open');modalTrigger?.focus();}
    function selectProjects(selected=''){return `<option value="">灵感收件箱</option>${activeProjects().map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)}</option>`).join('')}`;}
    function openTask(id=''){const task=data.tasks.find(t=>t.id===id);const t=task||{title:'',projectId:activeProject,status:'todo',progress:0,priority:'medium',due:'',note:''};openModal(`<div class="dialog-head"><h2>${task?'编辑任务':'新建任务'}</h2><button class="icon-btn" data-close aria-label="关闭">${icon('close')}</button></div><form id="task-form"><div class="dialog-body"><div class="field"><label for="task-title">任务名称</label><input id="task-title" name="title" required maxlength="120" placeholder="这一步要完成什么？" value="${esc(t.title)}"></div><div class="form-row"><div class="field"><label for="task-project">所属项目</label><select id="task-project" name="projectId">${selectProjects(t.projectId)}</select></div><div class="field"><label for="task-status">当前状态</label><select id="task-status" name="status">${Object.entries(statusName).map(([k,v])=>`<option value="${k}" ${t.status===k?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="field"><label for="task-progress">完成进度</label><div class="range-row"><input id="task-progress" style="flex:1" name="progress" type="range" min="0" max="100" step="5" value="${t.progress}"><span class="range-value" id="progress-value">${t.progress}%</span></div></div><div class="form-row"><div class="field"><label for="task-priority">优先级</label><select id="task-priority" name="priority"><option value="high" ${t.priority==='high'?'selected':''}>高</option><option value="medium" ${t.priority==='medium'?'selected':''}>普通</option><option value="low" ${t.priority==='low'?'selected':''}>低</option></select></div><div class="field"><label for="task-due">截止日期</label><input id="task-due" name="due" type="date" value="${esc(t.due)}"></div></div><div class="field"><label for="task-note">备注</label><textarea id="task-note" name="note" placeholder="补充背景、下一步或相关链接">${esc(t.note)}</textarea></div></div><div class="dialog-foot">${task?'<button type="button" class="btn btn-quiet btn-danger" data-delete-task>删除任务</button>':'<span></span>'}<div class="foot-right"><button type="button" class="btn" data-close>取消</button><button class="btn btn-primary" type="submit">保存任务</button></div></div></form>`);
      const range=modalRoot.querySelector('#task-progress');range.addEventListener('input',()=>{modalRoot.querySelector('#progress-value').textContent=range.value+'%';});modalRoot.querySelector('#task-status').addEventListener('change',e=>{if(e.target.value==='done')range.value=100;else if(Number(range.value)===100)range.value=85;modalRoot.querySelector('#progress-value').textContent=range.value+'%';});modalRoot.querySelector('#task-form').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.currentTarget);const status=fd.get('status');const value={title:fd.get('title').trim(),projectId:fd.get('projectId'),status,progress:status==='done'?100:Math.min(95,Number(fd.get('progress'))),priority:fd.get('priority'),due:fd.get('due'),note:fd.get('note').trim()};if(task)Object.assign(task,value);else data.tasks.unshift({id:uid(),...value});persist();closeModal();render();notify(task?'任务已更新':'任务已创建');});modalRoot.querySelector('[data-delete-task]')?.addEventListener('click',()=>confirmDelete('确定删除这项任务？',()=>{data.tasks=data.tasks.filter(x=>x.id!==id);persist();closeModal();render();notify('任务已删除');}));}
    function toggleTask(id){const t=data.tasks.find(x=>x.id===id);if(!t)return;t.status=t.status==='done'?'todo':'done';t.progress=t.status==='done'?100:0;persist();render();notify(t.status==='done'?'任务已完成':'已移回待开始');}
    function openIdea(id=''){const idea=data.ideas.find(i=>i.id===id);const i=idea||{title:'',body:'',tag:'产品想法',created:dateAfter(0)};openModal(`<div class="dialog-head"><h2>${idea?'灵感详情':'记下一个灵感'}</h2><button class="icon-btn" data-close aria-label="关闭">${icon('close')}</button></div><form id="idea-form"><div class="dialog-body"><div class="field"><label for="idea-title">一句话记下它</label><input id="idea-title" name="title" required maxlength="100" placeholder="一个还不完整的想法也可以" value="${esc(i.title)}"></div><div class="field"><label for="idea-body">多写一点（选填）</label><textarea id="idea-body" name="body" placeholder="记下背景、场景，或者你担心忘掉的细节">${esc(i.body)}</textarea></div><div class="field"><label for="idea-tag">归类</label><select id="idea-tag" name="tag">${['产品想法','交互体验','体验优化','技术探索','随手记录',...new Set(data.ideas.map(x=>x.tag).filter(Boolean))].filter((x,n,a)=>a.indexOf(x)===n).map(tag=>`<option ${tag===i.tag?'selected':''}>${esc(tag)}</option>`).join('')}</select></div></div><div class="dialog-foot">${idea?'<button type="button" class="btn btn-quiet btn-danger" data-delete-idea>删除</button><button type="button" class="btn" data-convert>转成任务</button>':'<span></span>'}<div class="foot-right"><button type="button" class="btn" data-close>取消</button><button class="btn btn-primary" type="submit">保存灵感</button></div></div></form>`);
      modalRoot.querySelector('#idea-form').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.currentTarget),value={title:fd.get('title').trim(),body:fd.get('body').trim(),tag:fd.get('tag')};if(idea)Object.assign(idea,value);else data.ideas.unshift({id:uid(),...value,created:dateAfter(0)});persist();closeModal();render();notify(idea?'灵感已更新':'灵感已收下');});modalRoot.querySelector('[data-delete-idea]')?.addEventListener('click',()=>confirmDelete('确定删除这条灵感？',()=>{data.ideas=data.ideas.filter(x=>x.id!==id);persist();closeModal();render();notify('灵感已删除');}));modalRoot.querySelector('[data-convert]')?.addEventListener('click',()=>{const title=idea.title,note=idea.body;data.ideas=data.ideas.filter(x=>x.id!==id);const taskId=uid();data.tasks.unshift({id:taskId,title,projectId:'',status:'todo',progress:0,priority:'medium',due:'',note});persist();closeModal();render();notify('灵感已转为收件箱任务');openTask(taskId);});}
    const colors=['#388b7e','#c48a4b','#6782b1','#8b70a7','#be6d69','#63856c'];
    function openProject(id=''){const project=projectBy(id);const p=project||{name:'',description:'',color:colors[0]};openModal(`<div class="dialog-head"><h2>${project?'项目设置':'创建项目'}</h2><button class="icon-btn" data-close aria-label="关闭">${icon('close')}</button></div><form id="project-form"><div class="dialog-body"><div class="field"><label for="project-name">项目名称</label><input id="project-name" name="name" required maxlength="60" placeholder="例如：个人网站改版" value="${esc(p.name)}"></div><div class="field"><label for="project-description">一句话说明</label><input id="project-description" name="description" maxlength="120" placeholder="这个项目想要达成什么？" value="${esc(p.description)}"></div><div class="field"><label for="project-color">项目标记色</label><select id="project-color" name="color">${colors.map(c=>`<option value="${c}" ${c===p.color?'selected':''}>● ${c}</option>`).join('')}</select></div></div><div class="dialog-foot">${project?'<button type="button" class="btn btn-quiet" data-archive>'+ (project.archived?'恢复项目':'归档项目')+'</button>':'<span></span>'}<div class="foot-right">${project?'<button type="button" class="btn btn-quiet btn-danger" data-delete-project>删除</button>':''}<button type="button" class="btn" data-close>取消</button><button class="btn btn-primary" type="submit">保存项目</button></div></div></form>`);
      modalRoot.querySelector('#project-form').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.currentTarget),value={name:fd.get('name').trim(),description:fd.get('description').trim(),color:fd.get('color')};if(project)Object.assign(project,value);else data.projects.push({id:uid(),...value,archived:false});persist();closeModal();render();notify(project?'项目已更新':'项目已创建');});modalRoot.querySelector('[data-archive]')?.addEventListener('click',()=>{project.archived=!project.archived;persist();closeModal();if(activeProject===id)go('tasks','');else render();notify(project.archived?'项目已归档':'项目已恢复');});modalRoot.querySelector('[data-delete-project]')?.addEventListener('click',()=>confirmDelete('删除项目后，项目任务会移入灵感收件箱。确定继续？',()=>{data.projects=data.projects.filter(x=>x.id!==id);data.tasks.forEach(t=>{if(t.projectId===id)t.projectId='';});persist();closeModal();render();notify('项目已删除');}));}
    function confirmDelete(text,callback){const dialog=document.createElement('div');dialog.className='overlay';dialog.innerHTML=`<section class="dialog" style="width:min(100%,360px)"><div class="dialog-head"><h2>请确认</h2><button class="icon-btn" data-cancel aria-label="关闭">${icon('close')}</button></div><div class="confirm-text">${esc(text)}</div><div class="dialog-foot"><span></span><div class="foot-right"><button class="btn" data-cancel>取消</button><button class="btn btn-primary" style="background:#b95353;border-color:#b95353" data-confirm>确认删除</button></div></div></section>`;modalRoot.append(dialog);dialog.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>dialog.remove());dialog.querySelector('[data-confirm]').onclick=()=>{dialog.remove();callback();};}
    document.addEventListener('keydown',e=>{
      if(!modalRoot.innerHTML)return;
      if(e.key==='Escape'){const overlays=modalRoot.querySelectorAll('.overlay');if(overlays.length>1)overlays[overlays.length-1].remove();else closeModal();return;}
      if(e.key==='Tab'){
        const overlays=modalRoot.querySelectorAll('.overlay');
        const controls=[...overlays[overlays.length-1].querySelectorAll('button,input,select,textarea')];
        const first=controls[0],last=controls[controls.length-1];
        if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
        else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
      }
    });
    function syncViewport(){document.documentElement.style.setProperty('--viewport-height',`${window.visualViewport?.height || window.innerHeight}px`);}
    window.visualViewport?.addEventListener('resize',syncViewport);
    window.addEventListener('resize',syncViewport);
    syncViewport();
    render();
  })();
  </script>
</body>
</html>
